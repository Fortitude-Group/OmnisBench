[project]
name = "omnisbench"
version = "0.0.1"
description = "Open, reproducible benchmark for LLM routing efficiency."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "datasets>=2.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-asyncio>=0.23"]

[project.scripts]
omnisbench = "omnisbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnisbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
