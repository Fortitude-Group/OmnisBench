# USD per 1,000,000 tokens. Snapshot date is the filename. Update by adding a new dated file.
# Base rates only (no caching, no batch discount); OmnisBench sends one uncached request per item.
# Covers the five-model pool of configs/fresh-run-2026-10.yaml only. The 2026-08-18 snapshot still
# prices the older models, and each run directory keeps its own copy for `omnisbench verify`.
# Sources: platform.claude.com models overview and developers.openai.com model pages, checked 2026-10-19.
snapshot_date: "2026-10-19"
models:
  "anthropic/claude-opus-5-5":
    input_per_mtok: 4.00
    output_per_mtok: 20.00
  "anthropic/claude-sonnet-5-5":
    input_per_mtok: 2.00
    output_per_mtok: 10.00
  # Haiku 5.5 is 5x these rates above 100K prompt tokens; our prompts are under 1K, so it never applies.
  "anthropic/claude-haiku-5-5":
    input_per_mtok: 0.10
    output_per_mtok: 0.50
  # gpt-5.6 models are billed 2x input / 1.5x output for the whole request above 272K prompt tokens; not reached here.
  "openai/gpt-5.6-terra":
    input_per_mtok: 2.00
    output_per_mtok: 12.00
  "openai/gpt-5.6-luna":
    input_per_mtok: 0.20
    output_per_mtok: 1.20
