# Perturbation-gap contamination probe. See docs/perturbation-probe.md.
# Scores every model on 8 fresh LiveCodeBench problems and on reworded copies that keep the
# test cases identical, then reports the drop per model. Capped small to bound cost.
run_date: "2026-08-23"
max_tokens: 16384
pricing: "config/pricing/2026-08-18.yaml"
providers:
  openai:    { base_url: "https://api.openai.com/v1",    api_key_env: "OPENAI_API_KEY",    token_param: "max_completion_tokens", send_sampling: false }
  anthropic: { base_url: "https://api.anthropic.com/v1", api_key_env: "ANTHROPIC_API_KEY", token_param: "max_tokens",            send_sampling: false }
datasets:
  - { kind: livecodebench, name: livecodebench, seed: 0, limit: 8, contamination: fresh, min_date: "2025-01-01" }
models:
  opus5: { provider: anthropic, model_id: "claude-opus-5" }
  gpt5:  { provider: openai,    model_id: "gpt-5" }
  haiku: { provider: anthropic, model_id: "claude-haiku-4-5" }
  nano:  { provider: openai,    model_id: "gpt-5-nano" }
probe:
  # The rewording model. Offline and one-time; its output (the perturbed prompts) is published.
  generator: { provider: anthropic, model_id: "claude-opus-5" }
  gen_max_tokens: 3072
