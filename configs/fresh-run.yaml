# Capped run to produce a first fresh-vs-contaminated split.
# Small samples on purpose: enough for signal, cheap enough for a first paid run.
# max_tokens is the per-request output budget. 4096 truncates reasoning models on hard
# problems (they exhaust it mid-reasoning and emit no code), so hard suites need headroom.
run_date: "2026-08-20"
max_tokens: 16384
pricing: "config/pricing/2026-08-18.yaml"
providers:
  openai:    { base_url: "https://api.openai.com/v1",    api_key_env: "OPENAI_API_KEY",    token_param: "max_completion_tokens", send_sampling: false }
  anthropic: { base_url: "https://api.anthropic.com/v1", api_key_env: "ANTHROPIC_API_KEY", token_param: "max_tokens",            send_sampling: false }
datasets:
  - { kind: jsonl, name: humaneval, path: "data/humaneval.jsonl", seed: 0, limit: 10,
      contamination: likely_contaminated,
      prompt_prefix: "Complete the following Python function. Return the COMPLETE function (signature + body) in a single ```python code block.\n\n" }
  - { kind: jsonl, name: gsm8k, path: "data/gsm8k.jsonl", seed: 0, limit: 10,
      contamination: likely_contaminated,
      prompt_prefix: "Solve the problem. Show brief reasoning, then end with a final line: 'The answer is <number>.'\n\n" }
  - { kind: livecodebench, name: livecodebench, seed: 0, limit: 15,
      contamination: fresh, min_date: "2025-01-01" }
models:
  opus5: { provider: anthropic, model_id: "claude-opus-5" }
  gpt5:  { provider: openai,    model_id: "gpt-5" }
  haiku: { provider: anthropic, model_id: "claude-haiku-4-5" }
  nano:  { provider: openai,    model_id: "gpt-5-nano" }
policies:
  - { type: always_model, name: always_big,   model: opus5 }
  - { type: always_model, name: always_cheap, model: nano }
  - { type: random,       name: random,        pool: [opus5, gpt5, haiku, nano], seed: 0 }
  - { type: oracle,       name: oracle,        pool: [opus5, gpt5, haiku, nano] }
