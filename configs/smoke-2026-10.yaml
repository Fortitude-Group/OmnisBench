# One HumanEval item on each model in the October pool, to catch API errors before the paid run.
# Cap $1. Same providers, pricing and models as configs/fresh-run-2026-10.yaml.
run_date: "2026-10-19"
max_tokens: 32768
max_spend_usd: 1
pricing: "config/pricing/2026-10-19.yaml"
providers:
  openai:    { base_url: "https://api.openai.com/v1",    api_key_env: "OPENAI_API_KEY",    token_param: "max_completion_tokens", send_sampling: false }
  anthropic: { base_url: "https://api.anthropic.com/v1", api_key_env: "ANTHROPIC_API_KEY", token_param: "max_tokens",            send_sampling: false }
datasets:
  - { kind: jsonl, name: humaneval, path: "data/humaneval.jsonl", seed: 0, limit: 1,
      contamination: likely_contaminated,
      prompt_prefix: "Complete the following Python function. Return the COMPLETE function (signature + body) in a single ```python code block.\n\n" }
models:
  opus55:   { provider: anthropic, model_id: "claude-opus-5-5" }
  sonnet55: { provider: anthropic, model_id: "claude-sonnet-5-5" }
  haiku55:  { provider: anthropic, model_id: "claude-haiku-5-5" }
  terra:    { provider: openai,    model_id: "gpt-5.6-terra" }
  luna:     { provider: openai,    model_id: "gpt-5.6-luna" }
policies:
  - { type: always_model, name: always_big,      model: opus55 }
  - { type: always_model, name: always_cheap,    model: haiku55 }
  - { type: always_model, name: always_sonnet55, model: sonnet55 }
  - { type: always_model, name: always_terra,    model: terra }
  - { type: always_model, name: always_luna,     model: luna }
