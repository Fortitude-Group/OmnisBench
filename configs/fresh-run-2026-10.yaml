# October 2026 run: the Claude 5.5 and GPT-5.6 generation, to rebuild OmnisRouter's routing policy.
#
# Approved 2026-10-19 as a trimmed run: 50 tasks per dataset, estimated $17 to $34, hard cap $35
# (max_spend_usd stops the run once new responses cost more than that).
#
# Contamination, stated plainly: every published training cutoff in this pool (OpenAI gpt-5.6: 2026-02-16;
# Anthropic 5.5 models: Jun 2026) is later than the newest problem in the newest LiveCodeBench release
# (release_v6, problems 2025-01-04 to 2025-04-06; the HF dataset has not changed since 2025-06-05). So no
# LiveCodeBench problem is "fresh" for these models and none is tagged fresh here. The LCB split is tagged
# recent_pre_cutoff: harder and newer than HumanEval, but still possibly seen. Measure how much with the
# perturbation probe (docs/perturbation-probe.md) once the main run is in.
#
# max_tokens is 32768 (was 16384): in the 2026-08-20 run 6 of 15 LCB items for gpt-5 and gpt-5-nano hit
# the 16384 cap, so their scores were partly a truncation artefact. Reasoning tokens count against it.
#
# Claude 5.5 models run adaptive thinking at their API default effort (opus medium, sonnet high, haiku
# medium). The OpenAI-compatible endpoint ignores reasoning_effort, so effort cannot be set from this
# harness; the numbers are "as a default caller gets them", which is what the router's users get too.
# gpt-5.6 models run at their default reasoning effort (medium); no effort param is sent.
run_date: "2026-10-19"
max_tokens: 32768
max_spend_usd: 35
training_cutoff: "2026-02-16"   # earliest in the pool (gpt-5.6-terra/luna); Anthropic 5.5 models are Jun 2026
pricing: "config/pricing/2026-10-19.yaml"
providers:
  openai:    { base_url: "https://api.openai.com/v1",    api_key_env: "OPENAI_API_KEY",    token_param: "max_completion_tokens", send_sampling: false }
  anthropic: { base_url: "https://api.anthropic.com/v1", api_key_env: "ANTHROPIC_API_KEY", token_param: "max_tokens",            send_sampling: false }
datasets:
  # 50 of each, sampled with seed 0. The full sets (164 / 200) are a re-run with a higher limit.
  - { kind: jsonl, name: humaneval, path: "data/humaneval.jsonl", seed: 0, limit: 50,
      contamination: likely_contaminated,
      prompt_prefix: "Complete the following Python function. Return the COMPLETE function (signature + body) in a single ```python code block.\n\n" }
  - { kind: jsonl, name: gsm8k, path: "data/gsm8k.jsonl", seed: 0, limit: 50,
      contamination: likely_contaminated,
      prompt_prefix: "Solve the problem. Show brief reasoning, then end with a final line: 'The answer is <number>.'\n\n" }
  # 50 of the 112 stdin problems from 2025-01-01 (release_v6 only, the loader skips functional/LeetCode
  # problems). LCB is most of the cost, reasoning models write 5k to 16k tokens per problem.
  # hf_files limits the download to test6.jsonl (134 MB) instead of all six files (about 4.5 GB).
  - { kind: livecodebench, name: livecodebench, seed: 0, limit: 50,
      contamination: recent_pre_cutoff, min_date: "2025-01-01",
      hf_files: ["test6.jsonl"] }
models:
  opus55:   { provider: anthropic, model_id: "claude-opus-5-5" }
  sonnet55: { provider: anthropic, model_id: "claude-sonnet-5-5" }
  haiku55:  { provider: anthropic, model_id: "claude-haiku-5-5" }
  terra:    { provider: openai,    model_id: "gpt-5.6-terra" }
  luna:     { provider: openai,    model_id: "gpt-5.6-luna" }
# One always_model policy per model so every model has a complete, unbiased row for the router bridge.
# These cost nothing extra: random and oracle reuse the same cached responses.
policies:
  - { type: always_model, name: always_big,      model: opus55 }
  - { type: always_model, name: always_cheap,    model: haiku55 }
  - { type: always_model, name: always_sonnet55, model: sonnet55 }
  - { type: always_model, name: always_terra,    model: terra }
  - { type: always_model, name: always_luna,     model: luna }
  - { type: random,       name: random,          pool: [opus55, sonnet55, haiku55, terra, luna], seed: 0 }
  - { type: oracle,       name: oracle,          pool: [opus55, sonnet55, haiku55, terra, luna] }
